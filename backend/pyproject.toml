[project]
name = "classmind-ai"
version = "0.2.0"
description = "The AI learning layer for every classroom."
requires-python = ">=3.10"
# Keep in sync with requirements.txt: Vercel installs from pyproject.toml when it exists
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0; sys_platform != 'win32'",
  "uvicorn-worker>=0.3; sys_platform != 'win32'",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "reportlab>=4.0,<5",
  "anthropic>=0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
